{% extends "base.html" %}
{% block title %}Profile — SmartRecipe AI{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>👤 Your Profile</h1>

    <div class="profile-meta">
      <p><strong>🏷️ Username:</strong> {{ user.username }}</p>
      <p><strong>🗓️ Member Since:</strong> {{ user.created_at }}</p>
    </div>

    <form method="POST" action="{{ url_for('profile') }}" class="auth-form">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ user.email }}" required>

      <button type="submit" class="btn-solid btn-full">💾 Save Changes</button>
    </form>
  </div>
</section>
{% endblock %}
